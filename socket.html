<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      svg{width: 75px; height: 75px; fill: #00a6f4; cursor: pointer; position: fixed; bottom: 70px; right: 40px; z-index: 5;}
      #container{border:1px solid blue;display: flex;
    flex-direction: column;height: 70vh;width:450px;position:fixed; bottom: 100px; right: 105px; transform: scale(0); transform-origin: right bottom; opacity: 0; transition: transform 400ms cubic-bezier(.4,0,.2,1),opacity 400ms ease;}
      #form {width:100%; background: rgba(0, 0, 0, 0.15); padding: 0.25rem;  display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; cursor:pointer;margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }
#container.close{
  transform:  scale(1);
  opacity: 1;
}
      #messages {flex:1; display: flex; flex-direction: column; list-style-type: none; margin: 5px; padding: 0; overflow-y:auto; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { display:inline-block;width:fit-content;word-wrap:break-word;margin:5px;max-width:250px;height:auto;border-radius:10px;padding:10px 15px;background: #4a5565; color:white; align-self: flex-start;}
      #messages > li:nth-child(even) {display:inline-block;width:fit-content;word-wrap:break-word;margin:5px;max-width:250px;height:auto;border-radius:10px;padding:10px 15px;background: #d1d5dc; align-self: flex-end; }
    </style>
  </head>
  <body>
    <div id="chat-icon" onclick="Click()">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 13.5997 2.37562 15.1116 3.04346 16.4525C3.22094 16.8088 3.28001 17.2161 3.17712 17.6006L2.58151 19.8267C2.32295 20.793 3.20701 21.677 4.17335 21.4185L6.39939 20.8229C6.78393 20.72 7.19121 20.7791 7.54753 20.9565C8.88837 21.6244 10.4003 22 12 22Z" stroke="#1C274C" stroke-width="1.5"></path> <path opacity="0.5" d="M8 10.5H16" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round"></path> <path opacity="0.5" d="M8 14H13.5" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round"></path> </g></svg>
    </div>
    <div id="container" class="container">
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
    </form>
    </div>
    <script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
const input=document.getElementById('input')
const form=document.getElementById('form')
const message=document.getElementById('messages')
form.addEventListener('submit',(e)=>{
e.preventDefault();
if(input.value){
socket.emit('chat message',input.value)
input.value=''
}
})
socket.on('chat message',(msg)=>{
const item=document.createElement('li')
item.textContent=msg
message.appendChild(item)
message.scrollTop=message.scrollHeight
})
function Click(){
const icon=document.getElementById('chat-icon')
icon.nextElementSibling.classList.toggle('close')

}
</script>
  </body>
</html>
